<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
    <meta name="theme-color" content="#081318" />
  </head>
  <body class="bg-ink text-foam min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-sm rounded-xl border border-foam/10 bg-tide/40 p-6 text-center">
      <h1 class="font-serif text-2xl font-medium text-foam">You are offline</h1>
      <p class="mt-2 text-sm text-foam/60">Reconnect to load the latest content from the server.</p>
      <button onclick="location.reload()" class="amarra-btn amarra-btn-primary mt-6">Try again</button>
    </div>
  </body>
</html>
