<nav class="flex items-center justify-between">
  {{ if .HasPrev }}
  <a href="{{ if .Base }}{{ .Base }}&amp;page={{ .PrevPage }}{{ else }}?page={{ .PrevPage }}{{ end }}" class="text-copper hover:text-foam">← Previous</a>
  {{ else }}
  <span></span>
  {{ end }}
  <span class="text-sm text-foam/50">Page {{ .Page }}</span>
  {{ if .HasNext }}
  <a href="{{ if .Base }}{{ .Base }}&amp;page={{ .NextPage }}{{ else }}?page={{ .NextPage }}{{ end }}" class="text-copper hover:text-foam">Next →</a>
  {{ else }}
  <span></span>
  {{ end }}
</nav>
