<form action="{{ .Action }}" method="get"{{ if .Frame }} data-amarra-frame="{{ .Frame }}"{{ end }} class="flex flex-wrap items-end gap-4 rounded-xl border border-foam/10 bg-tide/40 p-4">
  {{ .Inner }}
  <button type="submit" class="amarra-btn amarra-btn-secondary">{{ if .Submit }}{{ .Submit }}{{ else }}Filter{{ end }}</button>
  {{ if .Clear }}<a href="{{ .Clear }}" class="amarra-btn amarra-btn-quiet">Clear</a>{{ end }}
</form>
