<dialog data-amarra-dialog-target class="m-0 ml-auto h-full max-h-full w-full max-w-sm border-0 border-l border-foam/10 bg-ink p-0 text-foam backdrop:bg-ink/70"{{ if .Id }} id="{{ .Id }}"{{ end }} closedby="any">
  <div class="flex h-full flex-col">
    {{ if .Title }}
    <p class="border-b border-foam/10 px-4 py-3 text-sm font-medium text-foam/70">{{ .Title }}</p>
    {{ end }}
    <div class="flex-1 overflow-y-auto p-4">{{ .Inner }}</div>
  </div>
</dialog>
