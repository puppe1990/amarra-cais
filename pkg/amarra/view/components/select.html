<div>
  <label class="amarra-label" for="{{ .Name }}">{{ .Label }}</label>
  <select
    class="amarra-field user-invalid:border-danger"
    id="{{ .Name }}"
    name="{{ .Name }}"
    amarra-hook="select"
    {{- if .Error }} aria-invalid="true"{{ end }}
  >{{ .Inner }}</select>
  {{ if .Error }}<p class="amarra-error">{{ .Error }}</p>{{ end }}
</div>
