<div>
  <label class="block text-sm font-medium text-slate-700 mb-1" for="{{ .Name }}">{{ .Label }}</label>
  <input
    class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"
    id="{{ .Name }}"
    name="{{ .Name }}"
    type="{{ if .Type }}{{ .Type }}{{ else }}text{{ end }}"
    value="{{ .Value }}"
  >
  {{ if .Error }}<p class="text-red-600 text-sm mt-1">{{ .Error }}</p>{{ end }}
</div>
