<div class="rounded-xl border border-foam/10 bg-tide/40 p-5">
  <p class="text-[13px] text-foam/60">{{ .Label }}</p>
  {{ if .Href }}
  <a href="{{ .Href }}" class="mt-2 block"><span class="font-mono text-2xl tabular-nums leading-none text-foam">{{ .Value }}</span></a>
  {{ else }}
  <p class="mt-2 font-mono text-2xl tabular-nums leading-none text-foam">{{ .Value }}</p>
  {{ end }}
  {{ if .Delta }}<p class="mt-2 text-[13px] text-foam/60">{{ .Delta }}</p>{{ end }}
  {{ if .Hint }}<p class="mt-2 text-[13px] text-foam/60">{{ .Hint }}</p>{{ end }}
</div>
