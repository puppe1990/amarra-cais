<details class="group border-b border-foam/10 last:border-b-0"{{ if .Open }} open{{ end }}{{ if .Name }} name="{{ .Name }}"{{ end }}>
  <summary class="flex cursor-pointer list-none items-center justify-between gap-3 px-4 py-3 text-sm text-foam marker:content-none">
    <span>{{ .Title }}</span>
    <svg class="h-4 w-4 flex-shrink-0 text-foam/50 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 9l6 6 6-6" /></svg>
  </summary>
  <div class="border-t border-foam/10 px-4 py-3 text-sm text-foam/80">{{ .Inner }}</div>
</details>
