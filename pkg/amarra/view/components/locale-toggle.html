<div class="flex items-center gap-1 font-mono text-[10px] uppercase tracking-[0.22em]" role="group" aria-label="Language">
  {{ range localeTags .Locales }}
  <form action="{{ if .Action }}{{ .Action }}{{ else }}/locale{{ end }}" method="post" data-amarra-skip>
    {{ csrfField $.CSRFToken }}
    <input type="hidden" name="locale" value="{{ . }}" />
    <button type="submit" class="px-2 py-1 text-copper hover:text-foam"{{- if eq (localeBase .Current) . }} aria-pressed="true"{{ end }}>{{ localeLabel . }}</button>
  </form>
  {{ end }}
</div>
