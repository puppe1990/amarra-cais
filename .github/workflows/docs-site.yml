name: Docs site

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/docs-site.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/docs-site.yml"

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

  testdocs:
    name: TestDocs contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      #295: website PRs skip ci.yml (paths-ignore website/**). Run the docs
      # contract tests here without the full smoke/scaffold suite (#407).
      - name: TestDocs
        run: go test ./internal/cli/ -count=1 -run TestDocs
