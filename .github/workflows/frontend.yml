name: Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS tooling
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: JS unit tests
        run: npm run js:test

      - name: Verify committed JS bundles match sources
        run: |
          npm run js:build
          git diff --exit-code pkg/cais/pwa/assets/amarra.js
