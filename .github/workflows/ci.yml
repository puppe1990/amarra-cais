name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "website/**"

permissions:
  contents: read

# A new push to the same PR cancels the previous run instead of paying for both.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # internal/cli scaffolds real apps (go mod tidy + build), so it is the
          # long pole; pkg/cais holds the concurrency-heavy code and keeps -race
          # on pull requests. Everything runs with -race on main.
          - shard: pkg
            race_on_pr: true
          - shard: internal
            race_on_pr: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # TestScaffold_AppIsPrettierClean formats fresh scaffolds with the repo's
      # prettier binary, so this shard needs the JS tooling installed.
      - uses: actions/setup-node@v4
        if: matrix.shard == 'internal'
        with:
          node-version: 22
          cache: npm

      - name: Install JS tooling
        if: matrix.shard == 'internal'
        run: npm ci

      - name: Run Go tests
        run: |
          RACE=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ matrix.race_on_pr }}" = "true" ]; then
            RACE="-race"
          fi
          go test ./${{ matrix.shard }}/... $RACE -count=1 -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  smoke:
    name: Smoke scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Smoke cais new
        run: bash scripts/smoke-scaffold.sh

  smoke-production:
    name: Smoke production boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Smoke production server boot
        run: bash scripts/smoke-production.sh
